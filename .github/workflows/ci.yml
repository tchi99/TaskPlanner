name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app tests migrations
      - run: TASKPLANNER_DATABASE_URL=sqlite:///./ci-taskplanner.db alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run test:auth
      - working-directory: frontend
        run: npm run build


  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tp022d-playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taskplanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskplanner_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TASKPLANNER_ENV: test
      TASKPLANNER_AUTH_MODE: local
      TASKPLANNER_PG_TEST_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/taskplanner_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app tests migrations
      - run: pytest -q tests/test_tp080b_postgres.py
      # TP-080D: only disposable localhost/taskplanner_test, never Supabase.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: python -m scripts.verify_disposable_restore

  render-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tests/check_render_blueprint.py
